name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build wheels for Linux only.
  #
  # Dropped macOS + Windows because the toolchain trail — PyO3 0.24.x
  # vs Python 3.14 on Windows runners, maturin's bundled sysconfig
  # gymnastics, the whack-a-mole between --find-interpreter /
  # --interpreter / ABI3 forward compat / generate-import-lib — was
  # not worth the cost-to-serve for those platforms. msinv is a
  # research simulator; the user and downstream consumers run Linux.
  # Non-Linux users can `pip install msinv` from sdist with a Rust
  # toolchain installed. Revisit after PyO3 ≥ 0.25 lands.
  # ---------------------------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # PyO3 0.24.x supports CPython 3.9 through 3.13. Pinning the
          # interpreter list here is better than `--find-interpreter`
          # because manylinux aarch64 containers pull in 3.14t
          # (free-threaded), which cannot use the limited API —
          # `PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1` can't rescue it.
          # Bump this list when PyO3 ≥ 0.25 is adopted.
          args: >-
            --release --out dist
            --interpreter python3.9 python3.10 python3.11 python3.12 python3.13
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # ---------------------------------------------------------------------------
  # Build source distribution
  # ---------------------------------------------------------------------------
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ---------------------------------------------------------------------------
  # Publish to PyPI
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/msinv
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
