name: Tests

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        # Restrict to CPython 3.9–3.13 (PyO3 0.24.x's supported range).
        # Manylinux aarch64 also drops 3.14t free-threaded, which can't
        # use the limited API; bumping PyO3 is the long-term fix.
        args: >-
          --release --out dist
          --interpreter python${{ matrix.python-version }}
        manylinux: auto

    - name: Install package and test deps
      run: |
        python -m pip install --upgrade pip
        # --find-links points pip at the local wheels directory so it
        # picks the cp<pyver> wheel matching this interpreter's ABI
        # tag (the old `dist/msinv-*.whl` glob fell over when the
        # alphabetically-first wheel didn't match the current Python).
        # No --no-index: numpy + other pure-Python deps still pull
        # from PyPI.
        pip install --find-links dist msinv
        pip install pytest pytest-timeout 'msprime>=1.2' stdpopsim

    - name: Run hull tests
      run: pytest tests/hull/ -v
