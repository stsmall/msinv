name: Tests

on:
  push:
    branches: [main, master, feature/*]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build wheel
      uses: PyO3/maturin-action@v1
      env:
        # PyO3 0.24.x maxes at Python 3.13; manylinux containers ship
        # 3.14 now. Build the 3.14 wheel against the stable ABI.
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      with:
        args: --release --out dist --find-interpreter
        manylinux: auto

    - name: Install package and test deps
      run: |
        python -m pip install --upgrade pip
        # --find-links + msinv (no version) lets pip pick the wheel
        # whose ABI tag matches the active interpreter, instead of
        # the alphabetically-first wheel matching dist/msinv-*.whl.
        pip install --find-links dist --no-index msinv
        pip install pytest pytest-timeout 'msprime>=1.2' stdpopsim

    - name: Run hull tests
      run: pytest tests/hull/ -v
