[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "msinv"
version = "0.3.4"
description = "ARG-based coalescent simulator with chromosomal inversions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Scott T. Small", email = "ssmall2@nd.edu" },
]
keywords = [
    "population-genetics",
    "coalescent",
    "chromosomal-inversions",
    "msprime",
    "tskit",
    "anopheles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "tskit>=0.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-timeout",
    "msprime>=1.2",
    "pandas>=1.3",
]
plots = [
    "matplotlib>=3.5",
    "PyPDF2",
]
all = [
    "msinv[test,plots]",
]

[project.urls]
Homepage = "https://github.com/stsmall/msinv"
Documentation = "https://github.com/stsmall/msinv/tree/main/docs"
Issues = "https://github.com/stsmall/msinv/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "msinv._msinv_core"
manifest-path = "rust/msinv-py/Cargo.toml"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = [
    ".venv",
    ".tmp",
    "build",
    "dist",
    "rust/target",
    ".claude/worktrees",
]

[tool.ruff.lint]
# Sensible defaults for a scientific Python codebase: pycodestyle errors,
# pyflakes, basic upgrades, and bug-likely checks. Skip noisy stylistic
# rules (E501 line-too-long handled separately, D docstring rules off).
select = ["E", "F", "W", "B", "UP"]
# Numerical / scientific code often has long expressions and intentional
# ambiguous names (alpha/beta/N/T). Whitelist common ones.
ignore = [
    "E501",  # line too long — formatter's job, not the linter's
    "E741",  # ambiguous variable name (e.g. l, I) — common in math
    "E731",  # lambda assignment — sometimes clearer in callbacks
    "B008",  # function calls in argument defaults — common in scientific configs
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely import for side-effect and use long fixtures
"tests/**/*.py" = ["F401", "F811"]
# Scratch scripts in .tmp/ should never gate commits
".tmp/**/*.py" = ["ALL"]
