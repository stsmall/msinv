[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msinv"
version = "0.1.0"
description = "Coalescent simulator with chromosomal inversions"
readme = "README_msinv.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Scott T. Small", email = "ssmall2@nd.edu" },
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
test = [
    "msprime>=1.2",
    "tskit>=0.5",
    "stdpopsim>=0.2",
]
all = [
    "msprime>=1.2",
    "tskit>=0.5",
    "stdpopsim>=0.2",
    "matplotlib>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["msinv"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.9"
numpy = ">=1.20"

[tool.pixi.feature.test.dependencies]
msprime = ">=1.2"
tskit = ">=0.5"
stdpopsim = ">=0.2"

[tool.pixi.feature.test.tasks]
test = "cd tests && python test_standard_coalescent.py && python test_msinv.py && python test_ld.py && python test_treeseq.py && python test_stdpopsim.py"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
