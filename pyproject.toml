[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "msinv"
version = "0.3.0"
description = "ARG-based coalescent simulator with chromosomal inversions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Scott T. Small", email = "ssmall2@nd.edu" },
]
keywords = [
    "population-genetics",
    "coalescent",
    "chromosomal-inversions",
    "msprime",
    "tskit",
    "anopheles",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "tskit>=0.5",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-timeout",
    "msprime>=1.2",
]
plots = [
    "matplotlib>=3.5",
    "PyPDF2",
]
all = [
    "msinv[test,plots]",
]

[project.urls]
Homepage = "https://github.com/stsmall/msinv"
Documentation = "https://github.com/stsmall/msinv/tree/main/docs"
Issues = "https://github.com/stsmall/msinv/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "msinv._msinv_core"
manifest-path = "rust/msinv-py/Cargo.toml"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600

# ---------------------------------------------------------------------------
# Pixi
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.9"
numpy = ">=1.20"
tskit = ">=0.5"

[tool.pixi.feature.test.dependencies]
pytest = ">=7.0"
pytest-timeout = "*"
msprime = ">=1.2"
pip = ">=26.0.1,<27"

[tool.pixi.feature.plots.dependencies]
matplotlib = ">=3.5"

[tool.pixi.feature.rust.dependencies]
python = ">=3.12,<3.14"
maturin = ">=1.4"

[tool.pixi.feature.test.tasks]
test = "pytest tests/hull/"
figures = "python examples/make_figures.py"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
all = { features = ["test", "plots"], solve-group = "default" }
rust = { features = ["test", "plots", "rust"], solve-group = "rust" }
