[package]
name = "msinv-py"
version = "0.3.3"
edition = "2021"
description = "PyO3 bindings for msinv-core"
license = "MIT"

[lib]
name = "_msinv_core"
crate-type = ["cdylib"]

[dependencies]
msinv-core = { path = "../msinv-core" }
pyo3 = { version = "0.24", features = ["extension-module", "generate-import-lib"] }
numpy = "0.24"
